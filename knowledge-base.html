<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · AI 奠基论文图谱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1420;
    --surface: #1a2130;
    --surface-2: #131a28;
    --border: rgba(255,255,255,.08);
    --border-hover: rgba(255,255,255,.18);
    --text: #c6cfdd;
    --muted: #7c8ba0;
    --head: #ffffff;
    --accent: #5b8cff;
    --accent-2: #b07cff;
    --c-align: #5b8cff;
    --c-gen:   #b07cff;
    --c-eff:   #e8a33d;
    --c-eco:   #4dd4c0;
    --c-mm:    #ff7a9e;
    --c-arch:  #7fd0a8;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --border: rgba(27,54,93,.10);
      --border-hover: rgba(27,54,93,.22);
      --text: #3c4a5c;
      --muted: #6b7a8d;
      --head: #0f1420;
      --accent: #2f6bff;
      --accent-2: #7a3fe0;
      --c-align: #2f6bff;
      --c-gen:   #7a3fe0;
      --c-eff:   #b57314;
      --c-eco:   #10897a;
      --c-mm:    #d6336c;
      --c-arch:  #3d7a56;
    }
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- 顶部导航 ---------- */
  nav.topnav {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  nav.topnav .wrap { display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 24px; }
  nav.topnav .brand { font-weight: 700; color: var(--head); font-size: 17px; }
  nav.topnav .brand span { color: var(--accent); }
  .back-btn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    color: #fff; border-radius: 9px; padding: 8px 16px;
    font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .back-btn:hover { filter: brightness(1.08); color: #fff; text-decoration: none; }

  /* ---------- 头部 ---------- */
  header { padding: 72px 0 44px; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 6px 14px; border-radius: 100px; margin-bottom: 26px;
  }
  .eyebrow::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--c-eco);
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.9rem);
    font-weight: 800; letter-spacing: -.03em; line-height: 1.08;
    margin-bottom: 22px; color: var(--head);
  }
  h1 span {
    background: linear-gradient(115deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .lead { max-width: 660px; color: var(--muted); font-size: 15.5px; }

  .stats {
    display: flex; flex-wrap: wrap; gap: 40px;
    margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--border);
  }
  .stat-num {
    font-size: 26px; font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; color: var(--head);
  }
  .stat-label { font-size: 12px; color: var(--muted); letter-spacing: .06em; }

  /* ---------- 筛选 ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 30px; }
  .filter {
    font: inherit; font-size: 13px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: 7px 16px; border-radius: 100px; cursor: pointer;
    transition: all .2s ease;
  }
  .filter:hover { color: var(--head); border-color: var(--border-hover); background: var(--surface-2); }
  .filter.active {
    color: #fff; background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent; font-weight: 600;
  }

  /* ---------- 卡片网格 ---------- */
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

  .card {
    position: relative;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px 20px 16px;
    cursor: pointer; overflow: hidden;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    animation: rise .45s ease backwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--c), transparent); opacity: .5;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 28px -16px rgba(0,0,0,.5);
  }
  .card:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

  .card[data-cat="align"] { --c: var(--c-align); }
  .card[data-cat="gen"]   { --c: var(--c-gen); }
  .card[data-cat="eff"]   { --c: var(--c-eff); }
  .card[data-cat="eco"]   { --c: var(--c-eco); }
  .card[data-cat="mm"]    { --c: var(--c-mm); }
  .card[data-cat="arch"]  { --c: var(--c-arch); }

  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .idx { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .05em; }
  .tag {
    font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 100px;
    color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    background: color-mix(in srgb, var(--c) 10%, transparent);
  }
  .year { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .card h2 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; line-height: 1.3; margin-bottom: 4px; color: var(--head); }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .summary { font-size: 13.5px; color: var(--text); line-height: 1.62; }

  /* ---------- 展开详情 ---------- */
  .detail { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1); }
  .card.open .detail { max-height: 340px; }

  .detail-inner { padding-top: 16px; margin-top: 16px; border-top: 1px dashed var(--border); }
  .d-label {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--c); font-weight: 700; margin-bottom: 6px;
  }
  .d-full { font-size: 12.5px; color: var(--muted); font-style: italic; margin-bottom: 12px; line-height: 1.5; }
  .d-impact { font-size: 13px; color: var(--text); line-height: 1.62; margin-bottom: 14px; }
  .d-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--c); text-decoration: none;
    padding: 5px 12px; border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
    background: color-mix(in srgb, var(--c) 6%, transparent);
    transition: background .2s ease;
  }
  .d-link:hover { background: color-mix(in srgb, var(--c) 16%, transparent); }

  .foot { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 14px; font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
  .chev { transition: transform .3s ease; display: inline-block; }
  .card.open .chev { transform: rotate(180deg); }
  .card.open .foot { color: var(--c); }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 64px; padding-top: 28px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 12px 28px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 0 18px 60px; }
    header { padding: 48px 0 32px; }
    .stats { gap: 28px; }
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <div class="brand">知识<span>库</span></div>
    <a class="back-btn" href="index.html">← 返回主页</a>
  </div>
</nav>

<div class="wrap">
  <header>
    <div class="eyebrow">2022 — 2024 · 技术路线图谱</div>
    <h1>AI 奠基论文<span>图谱</span></h1>
    <p class="lead">
      ChatGPT 之后的三年，AI 的爆发并非单一突破，而是几条技术路线在「规模化」的主旋律下
      交汇、分叉与迭代的结果。以下 12 篇论文，勾勒出今天 AI 能力边界与工程范式的轮廓。
    </p>
    <div class="stats">
      <div><div class="stat-num">12</div><div class="stat-label">奠基论文</div></div>
      <div><div class="stat-num">6</div><div class="stat-label">技术路线</div></div>
      <div><div class="stat-num">3</div><div class="stat-label">关键年份</div></div>
    </div>
  </header>

  <nav class="filters" id="filters">
    <button class="filter active" data-filter="all">全部</button>
    <button class="filter" data-filter="align">对齐与推理</button>
    <button class="filter" data-filter="gen">视觉生成</button>
    <button class="filter" data-filter="eff">效率基础设施</button>
    <button class="filter" data-filter="eco">开放生态</button>
    <button class="filter" data-filter="mm">多模态</button>
    <button class="filter" data-filter="arch">架构探索</button>
  </nav>

  <main class="grid" id="grid"></main>

  <footer>
    <span>点击卡片展开详情 · 链接均指向 arXiv 官方页面</span>
    <span>整理自 2022—2024 年公开论文</span>
  </footer>
</div>

<script>
const CAT_LABEL = {
  align: "对齐与推理",
  gen:   "视觉生成",
  eff:   "效率基础设施",
  eco:   "开放生态",
  mm:    "多模态",
  arch:  "架构探索"
};

const papers = [
  { title: "Chain-of-Thought", full: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", authors: "Wei et al.", venue: "NeurIPS 2022", year: 2022, cat: "align", summary: "引导模型在给出答案前先展示推理步骤，在复杂数学与逻辑任务上大幅提升表现。", impact: "揭示推理能力的「涌现」特性，为 o1、DeepSeek-R1 等推理模型铺平了道路。", link: "https://arxiv.org/abs/2201.11903" },
  { title: "Latent Diffusion", full: "High-Resolution Image Synthesis with Latent Diffusion Models", authors: "Rombach et al.", venue: "CVPR 2022", year: 2022, cat: "gen", summary: "在低维隐空间而非高维像素空间做扩散，大幅降低计算成本。", impact: "Stable Diffusion 的直接技术基础，让消费级显卡生成高质量图像成为可能，引爆 AI 绘画普及。", link: "https://arxiv.org/abs/2112.10752" },
  { title: "InstructGPT", full: "Training language models to follow instructions with human feedback", authors: "Ouyang et al.", venue: "NeurIPS 2022", year: 2022, cat: "align", summary: "系统确立 RLHF 三阶段范式（SFT → 奖励模型 → PPO），让语言模型从「会说话」变成「听话」。", impact: "直接催生 ChatGPT；RLHF 成为此后所有对话模型的标准对齐流程。", link: "https://arxiv.org/abs/2203.02155" },
  { title: "FlashAttention", full: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness", authors: "Dao et al.", venue: "NeurIPS 2022", year: 2022, cat: "eff", summary: "通过 IO 感知的分块计算，将注意力机制的显存复杂度从二次方降至线性，且保持精确。", impact: "几乎所有前沿模型训练与推理的基础设施级贡献，解除了长序列建模的核心瓶颈。", link: "https://arxiv.org/abs/2205.14135" },
  { title: "Flow Matching", full: "Flow Matching for Generative Modeling", authors: "Lipman et al.", venue: "ICLR 2023", year: 2022, cat: "gen", summary: "学习从噪声到数据的连续流场，替代扩散模型中离散的加噪/去噪步骤，理论更简洁。", impact: "成为 FLUX.1、Stable Diffusion 3 等新一代生成模型的重要建模范式。", link: "https://arxiv.org/abs/2210.02747" },
  { title: "DiT", full: "Scalable Diffusion Models with Transformers", authors: "Peebles & Xie", venue: "ICCV 2023", year: 2022, cat: "gen", summary: "用 Transformer 替换扩散模型中传统的 U-Net 主干，并系统验证其可扩展性。", impact: "Sora 等视频生成模型的关键架构基础；在 ImageNet 256×256 上取得 FID 2.27。", link: "https://arxiv.org/abs/2212.09748" },
  { title: "LLaMA", full: "LLaMA: Open and Efficient Foundation Language Models", authors: "Touvron et al.", venue: "arXiv 2023", year: 2023, cat: "eco", summary: "仅使用公开数据集，训练出性能匹敌闭源模型的基础模型，并将权重开放给研究社区。", impact: "催生席卷全球的开源大模型生态（Alpaca、Vicuna、Llama 2/3），改变了 AI 权力的分布。", link: "https://arxiv.org/abs/2302.13971" },
  { title: "GPT-4", full: "GPT-4 Technical Report", authors: "OpenAI", venue: "arXiv 2023", year: 2023, cat: "mm", summary: "技术报告未披露细节，但展示了图像理解与强大语言推理深度融合后所能达到的能力上限。", impact: "确立「多模态 + 大规模」作为前沿模型的标准形态。", link: "https://arxiv.org/abs/2303.08774" },
  { title: "LLaVA", full: "Visual Instruction Tuning", authors: "Liu et al.", venue: "NeurIPS 2023", year: 2023, cat: "mm", summary: "用纯文本 GPT-4 生成多模态指令数据，通过视觉指令微调对齐视觉编码器与语言模型。", impact: "以极低成本为开源社区提供强大且可复现的多模态基线，极大推动视觉-语言研究。", link: "https://arxiv.org/abs/2304.08485" },
  { title: "DPO", full: "Direct Preference Optimization: Your Language Model is Secretly a Reward Model", authors: "Rafailov et al.", venue: "NeurIPS 2023", year: 2023, cat: "align", summary: "无需显式训练奖励模型和复杂强化学习，直接将偏好数据转化为简洁的分类损失。", impact: "大幅降低对齐的门槛与成本，成为开源社区模型微调的主流方法。", link: "https://arxiv.org/abs/2305.18290" },
  { title: "Mamba", full: "Mamba: Linear-Time Sequence Modeling with Selective State Spaces", authors: "Gu & Dao", venue: "arXiv 2023", year: 2023, cat: "arch", summary: "选择性状态空间模型（SSM），在保持线性复杂度的同时实现高效长序列建模。", impact: "对 Transformer 统治地位的根本性挑战，开启 SSM 架构研究热潮。", link: "https://arxiv.org/abs/2312.00752" },
  { title: "DeepSeekMoE", full: "DeepSeekMoE: Towards Ultimate Expert Specialization in Mixture-of-Experts Language Models", authors: "Dai et al.", venue: "ACL 2024", year: 2024, cat: "arch", summary: "提出细粒度专家分割与共享专家隔离策略，在稀疏激活下逼近稠密模型性能。", impact: "使有限算力下训练万亿参数级模型成为可能，是 DeepSeek-V3 的架构基石。", link: "https://arxiv.org/abs/2401.06066" }
];

const grid = document.getElementById("grid");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function render() {
  grid.innerHTML = papers.map((p, i) => `
    <article class="card" data-cat="${p.cat}" tabindex="0" role="button"
             aria-expanded="false" style="animation-delay:${i * 35}ms">
      <div class="card-top">
        <span class="idx">${String(i + 1).padStart(2, "0")}</span>
        <span class="tag">${CAT_LABEL[p.cat]}</span>
        <span class="year">${p.year}</span>
      </div>
      <h2>${esc(p.title)}</h2>
      <div class="meta">${esc(p.authors)} · ${esc(p.venue)}</div>
      <p class="summary">${esc(p.summary)}</p>

      <div class="detail">
        <div class="detail-inner">
          <div class="d-label">完整标题</div>
          <div class="d-full">${esc(p.full)}</div>
          <div class="d-label">核心影响</div>
          <p class="d-impact">${esc(p.impact)}</p>
          <a class="d-link" href="${p.link}" target="_blank" rel="noopener noreferrer">arXiv 原文 ↗</a>
        </div>
      </div>

      <div class="foot">
        <span>详情</span>
        <span class="chev">⌄</span>
      </div>
    </article>
  `).join("");
}

function toggleCard(card) {
  const open = card.classList.toggle("open");
  card.setAttribute("aria-expanded", open ? "true" : "false");
}

grid.addEventListener("click", e => {
  if (e.target.closest(".d-link")) return;
  const card = e.target.closest(".card");
  if (card) toggleCard(card);
});

grid.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".card");
  if (!card) return;
  e.preventDefault();
  toggleCard(card);
});

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".filter");
  if (!btn) return;
  document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const f = btn.dataset.filter;
  document.querySelectorAll(".card").forEach(card => {
    const show = f === "all" || card.dataset.cat === f;
    card.style.display = show ? "" : "none";
  });
});

render();
</script>
</body>
</html>
